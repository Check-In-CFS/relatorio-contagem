events {}

http {
  # Reflete a origem de quem chama (o app em localhost:3000) para permitir
  # cookies/credenciais no CORS.
  map $http_origin $cors_origin {
    default $http_origin;
    ""      "*";
  }

  # Resolver do Docker: aceita que auth/rest reiniciem com outro IP.
  resolver 127.0.0.11 valid=10s;

  server {
    listen 8000;
    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location = /health {
      access_log off;
      return 200 "ok\n";
    }

    location /auth/v1/ {
      include /etc/nginx/cors.conf;
      set $auth http://auth:9999;
      rewrite ^/auth/v1/(.*)$ /$1 break;
      proxy_pass $auth;
    }

    location /rest/v1/ {
      include /etc/nginx/cors.conf;
      set $rest http://rest:3000;
      rewrite ^/rest/v1/(.*)$ /$1 break;
      proxy_pass $rest;
    }
  }
}
